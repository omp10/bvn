# BalVahini — single domain, frontend + API + websockets.
#
# CHANGE TWO THINGS: server_name and root. Nothing else is domain-specific.
#
#   sed -i "s/YOUR_DOMAIN/example.com/g" nginx.conf
#   sudo cp nginx.conf /etc/nginx/sites-available/balvahini.conf
#   sudo ln -sf /etc/nginx/sites-available/balvahini.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certbot rewrites this file when you run it — it adds the 443 server block and
# the redirect. Do not hand-edit those parts afterwards.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    root /var/www/balvahini;
    index index.html;

    # Vehicle documents and photos are up to 5 MB. Nginx defaults to 1 MB, so
    # without this every upload fails with 413 before it reaches Node.
    client_max_body_size 10m;

    # Hashed asset filenames change on every build, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The public front door, at exactly "/" and nowhere else. Without the "="
    # this would swallow every route in the app; with it, /login, /parent/login
    # and /admin all still reach the React app below.
    location = / {
        root /var/www/coming-soon;
        try_files /index.html =404;
    }

    # The React app. Any unknown path falls through to index.html so client-side
    # routes like /school/live survive a refresh or a pasted link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The API trusts this to rate-limit by real client IP and to build links.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded logos, photos and vehicle documents. Proxied rather than served
    # from disk: the files live in the deploy user's home directory, which
    # www-data usually cannot read, and Node already sets the right headers.
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live tracking. Without the Upgrade headers Socket.IO silently degrades to
    # long-polling: it still works, but every bus position costs a round trip.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A parked bus sends nothing for minutes at a time; the default 60s read
        # timeout would drop the socket and force a reconnect loop.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_cache_bypass $http_upgrade;
    }

    # Razorpay posts here. Same proxy, listed separately so it is obvious this
    # path must stay reachable without authentication.
    location /webhooks/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
